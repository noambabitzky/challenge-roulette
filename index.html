<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Roulette</title>
  <style>
    :root {
      --bg1: #ff9a9e;
      --bg2: #a18cd1;
      --bg3: #84fab0;
      --card: rgba(255, 255, 255, 0.92);
      --text: #2d2a4a;
      --muted: #6b6890;
      --accent: #6c5ce7;
      --accent-2: #fd79a8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 300% 300%;
      animation: drift 18s ease infinite;
    }

    @keyframes drift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 24px;
      padding: clamp(24px, 5vw, 40px);
      box-shadow: 0 20px 50px rgba(45, 42, 74, 0.25);
      text-align: center;
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .challenge-box {
      min-height: 170px;
      border-radius: 18px;
      padding: 24px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #f4f1ff;
      border: 3px dashed #d6ceff;
      transition: background 0.4s, border-color 0.4s;
    }

    .emoji {
      font-size: 3rem;
      line-height: 1;
    }

    .category {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
    }

    .challenge-text {
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      font-weight: 600;
      margin: 0;
    }

    .pop { animation: pop 0.45s cubic-bezier(.2, 1.6, .4, 1); }

    @keyframes pop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    button {
      font: inherit;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    .primary {
      color: #fff;
      font-size: 1.1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
    }

    .secondary {
      color: var(--accent);
      background: #ece8ff;
    }

    .secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .stats {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat {
      background: #fff;
      border-radius: 14px;
      padding: 10px 18px;
      box-shadow: 0 4px 12px rgba(45, 42, 74, 0.08);
      min-width: 110px;
    }

    .stat strong {
      display: block;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .stat span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 14px;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(720deg); opacity: 0.8; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, .pop, .confetti { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎲 Challenge Roulette</h1>
    <p class="subtitle">Click the button to get a random fun challenge!</p>

    <div class="challenge-box" id="box" aria-live="polite">
      <div class="emoji" id="emoji">✨</div>
      <span class="category" id="category" hidden></span>
      <p class="challenge-text" id="text">Ready when you are…</p>
    </div>

    <div class="buttons">
      <button class="primary" id="generate">Give me a challenge!</button>
      <button class="secondary" id="done" disabled>✅ I did it!</button>
    </div>

    <div class="stats">
      <div class="stat"><strong id="rolled">0</strong><span>Challenges rolled</span></div>
      <div class="stat"><strong id="completed">0</strong><span>Completed</span></div>
    </div>
  </main>

  <script>
    const categories = {
      Movement: { emoji: "🏃", color: "#00b894", bg: "#e6fff7", items: [
        "Do 10 jumping jacks right now!",
        "Stand on one foot for 30 seconds.",
        "Do your best dance move for 15 seconds.",
        "Touch your toes 5 times.",
        "Walk around the room like a robot."
      ]},
      Creative: { emoji: "🎨", color: "#e17055", bg: "#fff1ec", items: [
        "Draw a cat in under 20 seconds.",
        "Write a haiku about your breakfast.",
        "Invent a name for a new ice cream flavor.",
        "Describe your day using only 3 emojis.",
        "Make up a superhero with a very silly power."
      ]},
      Brain: { emoji: "🧠", color: "#0984e3", bg: "#eaf4ff", items: [
        "Name 5 animals that start with the letter B.",
        "Count backwards from 30 by 3s.",
        "Spell your full name backwards out loud.",
        "List 4 things in the room that are blue.",
        "Think of a word that rhymes with 'agent'."
      ]},
      Social: { emoji: "💬", color: "#a55eea", bg: "#f5edff", items: [
        "Give someone near you a genuine compliment.",
        "Send a friend a funny GIF.",
        "Tell the person next to you a joke.",
        "Ask someone about their favorite movie.",
        "High-five the nearest human (with permission!)."
      ]},
      "AI Agents": { emoji: "🤖", color: "#fd79a8", bg: "#fff0f6", items: [
        "Explain what an AI agent is in one sentence.",
        "Name 3 tools an AI agent might use.",
        "Invent a name for your very own AI assistant.",
        "Describe one task you'd love an agent to automate.",
        "Write a one-line prompt that makes an agent tell a joke."
      ]}
    };

    const all = Object.entries(categories).flatMap(([name, c]) =>
      c.items.map(text => ({ name, text, ...c }))
    );

    const $ = id => document.getElementById(id);
    let last = null;
    let rolled = 0;
    let completed = 0;

    $("generate").addEventListener("click", () => {
      let pick;
      do { pick = all[Math.floor(Math.random() * all.length)]; } while (pick === last && all.length > 1);
      last = pick;

      $("emoji").textContent = pick.emoji;
      $("category").textContent = pick.name;
      $("category").style.background = pick.color;
      $("category").hidden = false;
      $("text").textContent = pick.text;
      $("box").style.background = pick.bg;
      $("box").style.borderColor = pick.color;

      const box = $("box");
      box.classList.remove("pop");
      void box.offsetWidth; // restart animation
      box.classList.add("pop");

      $("rolled").textContent = ++rolled;
      $("done").disabled = false;
      $("generate").textContent = "Another one!";
    });

    $("done").addEventListener("click", () => {
      $("completed").textContent = ++completed;
      $("done").disabled = true;
      celebrate();
    });

    function celebrate() {
      const colors = ["#6c5ce7", "#fd79a8", "#00b894", "#fdcb6e", "#0984e3", "#e17055"];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[i % colors.length];
        c.style.animationDuration = 1.5 + Math.random() * 1.5 + "s";
        c.style.animationDelay = Math.random() * 0.3 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3500);
      }
    }
  </script>
</body>
</html>
